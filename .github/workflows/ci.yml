name: ProView checks

on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Build using the Pages project subpath
        env:
          BASE_PATH: /ProViewPresentation/
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test the production build with an HTTP backend contract fixture
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173/ProViewPresentation/
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run preview -- --port 4173
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
